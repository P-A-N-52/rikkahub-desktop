name: Restore pinned Pi vendor
description: Restore the source baseline and patches required by the desktop backend; model snapshot is a separate build input.
runs:
  using: composite
  steps:
    - name: Restore Pi source and dependencies
      shell: bash
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/earendil-works/pi.git pi
        cd pi
        git checkout 5cd93f688aaab89dbb6dfa4aca535f21796ae185
        git apply ../pi-patches/*.patch
        # Pi's old lockfile is migrated by the pinned Bun; host lockfiles remain frozen.
        bun install
