name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pc-server-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pi/ 是 gitignore 的本地浅克隆(vendored 源码),不进仓库。pc-server 直接
      # import 其 TS 源码,缺它 tsc 报 57 个找不到模块。按 CLAUDE.md「pi vendor
      # 维护手册」重建:浅克隆上游基线 + 应用 pi-patches/*.patch。
      - name: Restore pi vendor
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/earendil-works/pi.git pi
          cd pi
          git checkout 5cd93f688aaab89dbb6dfa4aca535f21796ae185
          git -c user.name=ci -c user.email=ci@local am ../pi-patches/*.patch

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install pc-server dependencies
        working-directory: pc-server
        run: bun install --frozen-lockfile

      - name: Type check pc-server
        working-directory: pc-server
        run: bun run typecheck

      - name: Run pc-server unit tests
        working-directory: pc-server
        run: bun test

      - name: Run request-chain smoke
        working-directory: pc-server
        run: bun run smoke:request-chain

      - name: Run backup roundtrip smoke
        working-directory: pc-server
        run: bun run smoke:backup-roundtrip

      - name: Check version consistency
        working-directory: pc-server
        run: bun run scripts/check-version-sync.ts

  web-ui-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: bun install --frozen-lockfile

      - name: Type check web-ui
        working-directory: web-ui
        run: bun run typecheck

      - name: Run web-ui unit tests
        working-directory: web-ui
        run: bun run test:unit

      - name: Build web-ui
        working-directory: web-ui
        run: bun run build
